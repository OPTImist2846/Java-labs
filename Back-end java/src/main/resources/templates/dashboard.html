<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Панель')}"></head>
<body>
<header th:replace="~{layout :: header}"></header>
<main>
    <h1>Панель</h1>
    <table>
        <tr><th>Користувач</th><td th:text="${currentUser.username}"></td></tr>
        <tr><th>Ім'я</th><td th:text="${currentUser.fullName}"></td></tr>
        <tr><th>Email</th><td th:text="${currentUser.email}"></td></tr>
        <tr>
            <th>Ролі</th>
            <td>
                <span th:each="role : ${currentUser.roles}" class="tag" th:text="${role}"></span>
                <span th:if="${#lists.isEmpty(currentUser.roles)}">немає</span>
            </td>
        </tr>
    </table>
    <h2>Права доступу</h2>
    <table>
        <thead><tr><th>Дія</th><th>Потрібна роль</th></tr></thead>
        <tbody>
        <tr><td>Перегляд усіх даних</td><td>ADMIN або PILOT</td></tr>
        <tr><td>Створення / редагування дронів, обладнання, журналів</td><td>ADMIN або PILOT</td></tr>
        <tr><td>Створення / редагування / видалення пілотів</td><td>ADMIN</td></tr>
        <tr><td>Видалення будь-яких записів</td><td>ADMIN</td></tr>
        </tbody>
    </table>
</main>
</body>
</html>
